<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Gallery — TWS Liquid Chef</title>
  <meta name="description" content="Beverages, food, corporate events, weddings, children's events and behind the scenes with TWS Liquid Chef.">
  <meta name="theme-color" content="#030407">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>document.documentElement.classList.add("js")</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="gallery">
  <a class="skip" href="#main">Skip to content</a>
  <div id="header"></div>

  <main id="main">
    <section class="phero phero--short">
      <div class="phero__img"><img src="https://images.unsplash.com/photo-1758247706694-7830caadea8d?w=1800&q=70&auto=format&fit=crop" alt="" fetchpriority="high"></div>
      <div class="wrap phero__inner">
        <p class="crumbs" data-in style="--in:60"><a href="index.html">Home</a> / Gallery</p>
        <h1><span class="line"><span data-in style="--in:140">The <em>gallery.</em></span></span></h1>
        <p class="lead" data-in style="--in:300">Moments from behind the bar and across the room. Tap any image to view it full size.</p>
      </div>
    </section>

    <section class="section" style="padding-top:2.5rem">
      <div class="wrap">
        <div class="seg" id="gallery-filter" role="group" aria-label="Filter gallery">
          <button class="is-active" aria-pressed="true" data-v="all">All</button>
          <button aria-pressed="false" data-v="beverages">Beverages</button>
          <button aria-pressed="false" data-v="food">Food</button>
          <button aria-pressed="false" data-v="corporate">Corporate</button>
          <button aria-pressed="false" data-v="weddings">Weddings</button>
          <button aria-pressed="false" data-v="children">Children's</button>
          <button aria-pressed="false" data-v="bts">Behind the scenes</button>
        </div>
        <div class="masonry" id="gallery"></div>
      </div>
    </section>
  </main>

  <div id="footer"></div>
  <script src="js/data.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
